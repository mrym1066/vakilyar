<script>
    // تنظیم تاریخ روز به صورت خودکار
    document.getElementById('current_date').textContent = new Date().toLocaleDateString('fa-IR');

    // محاسبه مدت جلسه به صورت خودکار
    document.getElementById('id_start_time').addEventListener('change', updateDuration);
    document.getElementById('id_end_time').addEventListener('change', updateDuration);

    function updateDuration() {
        let start = document.getElementById('id_start_time').value;
        let end = document.getElementById('id_end_time').value;

        if (start && end) {
            let diff = (new Date(`1970-01-01T${end}`) - new Date(`1970-01-01T${start}`)) / 60000;
            document.getElementById('duration_display').value = diff + " دقیقه";
        }
    }
</script>
