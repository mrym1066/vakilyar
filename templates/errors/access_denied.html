{% extends 'shared/_layout.html' %}

{% block title %}دسترسی غیرمجاز{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg">
                <div class="card-body py-5">
                    <i class="fa fa-lock fa-4x text-danger mb-3"></i>
                    <h2 class="text-danger">⛔ دسترسی غیرمجاز</h2>
                    <p class="text-muted mt-3">
                        شما به این صفحه دسترسی ندارید.
                        <br>
                        فقط مدیران سیستم می‌توانند اطلاعات موکل و هزینه‌ها را مشاهده کنند.
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'movakel-list' %}" class="btn btn-primary">
                            <i class="fa fa-arrow-right"></i> بازگشت به لیست پرونده‌ها
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
