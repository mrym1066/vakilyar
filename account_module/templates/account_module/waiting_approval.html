{% extends 'base.html' %}

{% block title %}در انتظار تأیید{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center mb-4">
                <div class="card-body py-5">
                    <i class="fas fa-hourglass-half fa-4x text-warning mb-3"></i>
                    <h3 class="card-title">در انتظار تأیید مدیر</h3>
                    <p class="card-text text-muted">
                        حساب کاربری شما با موفقیت ثبت شد.<br>
                        پس از تأیید توسط مدیر سیستم، می‌توانید وارد پنل کاربری شوید.
                    </p>
                    <a href="{% url 'logout_page' %}" class="btn btn-outline-secondary mt-2">خروج</a>
                    <a href="/articles/" class="btn btn-primary mt-2">مشاهده مقالات</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
